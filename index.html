<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articulos para payasos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section>
            <h2>Productos</h2>
            <p>Categoría:</p>
            <select id="select">
                <option value="todo">Todo</option>
                <option value="maquillaje">Maquillaje</option>
                <option value="vestimenta">Vestimenta</option>
            </select>
            <div id="productDiv" class="products"></div>
        </section>
        <section class="cartSection">
            <h2>Carrito</h2>
            <button id="showCartButton">Ver Cesta</button>
        </section>
    </main>

    <div id="cartModal" class="modal">
        <div class="modalContent">
            <div class="modalHeading">
                <h2>Tu cesta</h2>
                <button id="closeCartButton">Cerrar</button>
            </div>
            <p id="deliveryMessage"></p>
            <div id="cartDiv">El carrito está vacío.</div>
            <p class="total">Total: <span id="modalTotal">0,00 €</span></p>
            <button id="finishButton">Finalizar Compra</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
